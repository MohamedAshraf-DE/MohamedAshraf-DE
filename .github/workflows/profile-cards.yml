name: Restore Profile Trophies

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "15 3 * * *"

jobs:
  trophies:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download trophy SVG
        shell: bash
        run: |
          set -e
          mkdir -p assets
          tmp="assets/github-trophies.tmp.svg"
          success=false

          urls=(
            "https://trophy.ryglcloud.net/?username=MohamedAshraf-DE&theme=radical&no-frame=true&row=1&column=4"
            "https://gh-trophy.cdnsoft.net/?username=MohamedAshraf-DE&theme=radical&no-frame=true&row=1&column=4"
            "https://github-profile-trophy-winning.vercel.app/?username=MohamedAshraf-DE&theme=radical&no-frame=true&row=1&column=4"
            "https://github-profile-trophy-liard-delta.vercel.app/?username=MohamedAshraf-DE&theme=radical&no-frame=true&row=1&column=4"
          )

          for url in "${urls[@]}"; do
            echo "Trying $url"
            if curl -L --fail --retry 2 --connect-timeout 10 --max-time 40 "$url" -o "$tmp" \
              && grep -qi '<svg' "$tmp" \
              && [ "$(wc -c < "$tmp")" -gt 500 ]; then
              mv "$tmp" assets/github-trophies.svg
              success=true
              break
            fi
            rm -f "$tmp"
          done

          if [ "$success" != true ] && [ ! -f assets/github-trophies.svg ]; then
            echo "No trophy mirror returned a valid SVG."
            exit 1
          fi

      - name: Replace header badges with trophies
        shell: python
        run: |
          from pathlib import Path
          import re

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          replacement = '''  <a href="https://github.com/ryo-ma/github-profile-trophy">
            <img src="./assets/github-trophies.svg" alt="GitHub Trophies" />
          </a>'''

          pattern = re.compile(
              r'\s*<a href="https://github\.com/MohamedAshraf-DE\?tab=followers">.*?</a>\s*'
              r'<a href="https://github\.com/MohamedAshraf-DE\?tab=repositories">.*?</a>',
              re.S,
          )

          new_text, count = pattern.subn("\n" + replacement, text, count=1)

          if count == 0 and './assets/github-trophies.svg' not in text:
              raise RuntimeError("Could not find the Followers/Stars badge block in README.md")

          readme.write_text(new_text, encoding="utf-8")

      - name: Commit trophies
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/github-trophies.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "fix(profile): restore trophy cards"
            git push
          fi
