name: Refresh Profile Cards

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-cards.yml"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          THEME: radical

      - name: Pull generated cards
        run: git pull --rebase origin main

      - name: Refresh local trophy image
        shell: bash
        run: |
          mkdir -p assets
          tmp="assets/github-trophies.tmp.svg"
          mirrors=(
            "https://trophy.ryglcloud.net/?username=MohamedAshraf-DE&theme=radical&no-frame=true&row=1&column=4"
            "https://gh-trophy.cdnsoft.net/?username=MohamedAshraf-DE&theme=radical&no-frame=true&row=1&column=4"
            "https://github-profile-trophy-winning.vercel.app/?username=MohamedAshraf-DE&theme=radical&no-frame=true&row=1&column=4"
            "https://github-profile-trophy-liard-delta.vercel.app/?username=MohamedAshraf-DE&theme=radical&no-frame=true&row=1&column=4"
          )

          refreshed=false
          for url in "${mirrors[@]}"; do
            echo "Trying trophy mirror: $url"
            if curl --fail --location --silent --show-error --max-time 30 "$url" -o "$tmp" \
              && grep -qi "<svg" "$tmp" \
              && [ "$(wc -c < "$tmp")" -gt 500 ]; then
              mv "$tmp" assets/github-trophies.svg
              refreshed=true
              echo "Trophy image refreshed successfully."
              break
            fi
            rm -f "$tmp"
          done

          if [ "$refreshed" = false ]; then
            echo "All trophy mirrors were unavailable. Keeping the previous local trophy image if it exists."
          fi

      - name: Repair README analytics, trophies and snake
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          if text.startswith("[<!--"):
              text = text[1:]

          badge_block = '''  <a href="https://github.com/MohamedAshraf-DE?tab=followers">
            <img src="https://img.shields.io/github/followers/MohamedAshraf-DE?style=flat&logo=github&label=Followers" alt="GitHub Followers" />
          </a>
          <a href="https://github.com/MohamedAshraf-DE?tab=repositories">
            <img src="https://img.shields.io/github/stars/MohamedAshraf-DE?affiliations=OWNER&style=flat&logo=github&label=Stars" alt="GitHub Stars" />
          </a>'''

          old_external_trophy = '  <img src="https://github-profile-trophy.vercel.app/?username=MohamedAshraf-DE&theme=radical&no-frame=true&row=1&column=4" alt="Trophies" />'
          local_trophy = '''  <a href="https://github.com/ryo-ma/github-profile-trophy">
            <img src="./assets/github-trophies.svg" alt="GitHub Trophies" />
          </a>'''

          if Path("assets/github-trophies.svg").exists():
              text = text.replace(badge_block, local_trophy)
              text = text.replace(old_external_trophy, local_trophy)

          start_marker = "## 📊 GitHub Analytics"
          end_marker = "## 🚀 My Learning Journey"
          start = text.find(start_marker)
          end = text.find(end_marker)
          if start == -1 or end == -1 or end <= start:
              raise RuntimeError("Could not locate GitHub Analytics section")

          analytics = "\n".join([
              "## 📊 GitHub Analytics",
              "",
              '<div align="center">',
              "",
              '<img src="./profile-summary-card-output/radical/0-profile-details.svg" alt="GitHub profile details" width="100%" />',
              "",
              "<br><br>",
              "",
              '<img src="./profile-summary-card-output/radical/1-repos-per-language.svg" alt="Repositories per language" height="180em" />',
              '<img src="./profile-summary-card-output/radical/3-stats.svg" alt="GitHub statistics" height="180em" />',
              "",
              "<br><br>",
              "",
              '<img src="./profile-summary-card-output/radical/4-productive-time.svg" alt="Productive time" height="180em" />',
              "",
              "<br><br>",
              "",
              "<!-- Contribution Snake: generated by .github/workflows/snake.yml -->",
              "<picture>",
              '  <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/MohamedAshraf-DE/MohamedAshraf-DE/output/github-contribution-grid-snake-dark.svg" />',
              '  <source media="(prefers-color-scheme: light)" srcset="https://raw.githubusercontent.com/MohamedAshraf-DE/MohamedAshraf-DE/output/github-contribution-grid-snake.svg" />',
              '  <img alt="GitHub contribution snake animation" src="https://raw.githubusercontent.com/MohamedAshraf-DE/MohamedAshraf-DE/output/github-contribution-grid-snake.svg" width="100%" />',
              "</picture>",
              "",
              "</div>",
              "",
              "<br>",
              "",
          ])

          text = text[:start] + analytics + text[end:]
          path.write_text(text, encoding="utf-8")

      - name: Commit profile refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [ -f assets/github-trophies.svg ]; then
            git add assets/github-trophies.svg
          fi
          if git diff --cached --quiet; then
            echo "No profile changes to commit."
          else
            git commit -m "fix(profile): restore stable trophy cards"
            git push
          fi
