name: Refresh Profile Cards

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate self-hosted profile cards
        uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          username: MohamedAshraf-DE
          cards: overview,languages,contributions
          output-dir: assets/profile-cards
          themes: light,dark
          commit: false

      - name: Repair README analytics and snake
        shell: python
        run: |
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")

          # Remove the accidental character before the opening comment.
          if text.startswith("[<!--"):
              text = text[1:]

          # Replace the unreliable trophy service with stable Shields badges.
          old_trophy = '  <img src="https://github-profile-trophy.vercel.app/?username=MohamedAshraf-DE&theme=radical&no-frame=true&row=1&column=4" alt="Trophies" />'
          new_header_stats = '''  <a href="https://github.com/MohamedAshraf-DE?tab=followers">
    <img src="https://img.shields.io/github/followers/MohamedAshraf-DE?style=flat&logo=github&label=Followers" alt="GitHub Followers" />
  </a>
  <a href="https://github.com/MohamedAshraf-DE?tab=repositories">
    <img src="https://img.shields.io/github/stars/MohamedAshraf-DE?affiliations=OWNER&style=flat&logo=github&label=Stars" alt="GitHub Stars" />
  </a>'''
          text = text.replace(old_trophy, new_header_stats)

          start_marker = "## 📊 GitHub Analytics"
          end_marker = "## 🚀 My Learning Journey"
          start = text.find(start_marker)
          end = text.find(end_marker)

          if start == -1 or end == -1 or end <= start:
              raise RuntimeError("Could not locate the GitHub Analytics section in README.md")

          analytics = '''## 📊 GitHub Analytics

<div align="center">

<!-- Self-hosted overview card -->
<picture>
  <source media="(prefers-color-scheme: dark)" srcset="./assets/profile-cards/overview.dark.svg" />
  <img alt="GitHub profile overview" src="./assets/profile-cards/overview.light.svg" width="100%" />
</picture>

<br><br>

<!-- Self-hosted language card -->
<picture>
  <source media="(prefers-color-scheme: dark)" srcset="./assets/profile-cards/languages.dark.svg" />
  <img alt="GitHub languages" src="./assets/profile-cards/languages.light.svg" width="100%" />
</picture>

<br><br>

<!-- Self-hosted contributions and streaks -->
<picture>
  <source media="(prefers-color-scheme: dark)" srcset="./assets/profile-cards/contributions.dark.svg" />
  <img alt="GitHub contributions and streaks" src="./assets/profile-cards/contributions.light.svg" width="100%" />
</picture>

<br><br>

<!-- Contribution Snake: generated by .github/workflows/snake.yml -->
<picture>
  <source media="(prefers-color-scheme: dark)" srcset="https://raw.githubusercontent.com/MohamedAshraf-DE/MohamedAshraf-DE/output/github-contribution-grid-snake-dark.svg" />
  <source media="(prefers-color-scheme: light)" srcset="https://raw.githubusercontent.com/MohamedAshraf-DE/MohamedAshraf-DE/output/github-contribution-grid-snake.svg" />
  <img alt="GitHub contribution snake animation" src="https://raw.githubusercontent.com/MohamedAshraf-DE/MohamedAshraf-DE/output/github-contribution-grid-snake.svg" width="100%" />
</picture>

</div>

<br>

'''

          text = text[:start] + analytics + text[end:]
          path.write_text(text, encoding="utf-8")

      - name: Commit refreshed profile assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/profile-cards
          if git diff --cached --quiet; then
            echo "No profile changes to commit."
          else
            git commit -m "fix(profile): repair analytics cards and contribution snake"
            git push
          fi
